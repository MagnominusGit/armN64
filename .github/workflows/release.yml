# The standalone app's AppImages and APK, built by Armulators' workflow, for each release.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  app:
    uses: MagnominusGit/Armulators/.github/workflows/app.yml@main
    with:
      release: ${{ github.event.release.tag_name }}
    secrets:
      keystore: ${{ secrets.APK_KEYSTORE }}
